name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege by default; only the release job needs write access.
permissions:
  contents: read

jobs:
  # Runs on every push and pull request, not just on tags — a broken test or a
  # newly disclosed stdlib vulnerability should surface immediately, not at
  # release time.
  verify:
    name: Lint, vet, vulncheck & test
    runs-on: ubuntu-latest

    steps:
      # No job needs to push, so the token is not left in .git/config.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Built in a throwaway module instead of `go install ...@version`:
      # Go 1.27.2 writes export data version 5, and staticcheck v0.8.1 still
      # requires golang.org/x/tools v0.44, which only reads up to version 4
      # ("export data version 5 is greater than maximum supported version 4"
      # on every stdlib import). x/tools v0.51.0 reads version 5. `go install`
      # cannot override a dependency version, so pin both here. Go back to a
      # plain `go install honnef.co/go/tools/cmd/staticcheck@<version>` once
      # a staticcheck release requires x/tools v0.51.0 or newer.
      - name: Install staticcheck
        run: |
          mkdir -p "$RUNNER_TEMP/staticcheck-build"
          cd "$RUNNER_TEMP/staticcheck-build"
          go mod init staticcheck-build
          go get honnef.co/go/tools/cmd/staticcheck@v0.8.1 golang.org/x/tools@v0.51.0
          go install honnef.co/go/tools/cmd/staticcheck

      - name: Run staticcheck
        run: staticcheck ./...

      # Reports known vulnerabilities in the Go toolchain and stdlib that this
      # binary actually reaches. This proxy's whole job is outbound TLS, so a
      # crypto/tls advisory matters here more than in most projects.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run tests
        run: go test -race -v ./...

  build:
    name: Cross-compile localproxy
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: macos-intel
          - goos: darwin
            goarch: arm64
            suffix: macos-apple-silicon
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
          - goos: freebsd
            goarch: amd64
            suffix: freebsd-amd64
          - goos: freebsd
            goarch: arm64
            suffix: freebsd-arm64
          - goos: openbsd
            goarch: amd64
            suffix: openbsd-amd64
          - goos: netbsd
            goarch: amd64
            suffix: netbsd-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Expressions go through env, never straight into the script: a tag
      # name may hold $( ), ; or | (script injection). TestWorkflow_NoExpressionsInRun
      # guards this.
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
          OUT: localproxy-${{ matrix.suffix }}${{ matrix.ext }}
        run: |
          go build \
            -ldflags="-s -w -X main.Version=$VERSION" \
            -trimpath \
            -o "$OUT" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: localproxy-${{ matrix.suffix }}
          path: localproxy-${{ matrix.suffix }}${{ matrix.ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      # Only for the release notes file (.github/release-notes/<tag>.md).
      # persist-credentials: false keeps the write token out of .git/config.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Since v1.4.0: one SHA256SUMS file for all nine binaries, in the format
      # of `sha256sum` (check with `sha256sum -c SHA256SUMS` on Linux/WSL,
      # `shasum -a 256 -c SHA256SUMS` on macOS, Get-FileHash in PowerShell).
      # The step fails unless exactly nine binaries are present and every
      # line verifies against the files that get uploaded.
      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          count=$(ls -1 localproxy-* | wc -l)
          if [ "$count" -ne 9 ]; then
            echo "expected 9 binaries, found $count:"
            ls -l
            exit 1
          fi
          sha256sum localproxy-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      # Hand-written notes for this tag, if the repo has them; GitHub's
      # generated list of changes is appended either way.
      - name: Find release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          f=".github/release-notes/$TAG.md"
          if [ -f "$f" ]; then
            echo "path=$f" >> "$GITHUB_OUTPUT"
          fi

      # Created as a draft (since v1.4.0): the binaries are downloaded and
      # checked first, and the draft is published by hand after the JPKCom
      # Tools deploy (release order: tools first, then the proxy).
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          draft: true
          prerelease: false
