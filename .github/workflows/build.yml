name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege by default; only the release job needs write access.
permissions:
  contents: read

jobs:
  # Runs on every push and pull request, not just on tags — a broken test or a
  # newly disclosed stdlib vulnerability should surface immediately, not at
  # release time.
  verify:
    name: Lint, vet, vulncheck & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # Pinned instead of @latest: the newest stable staticcheck (2026.1 /
      # v0.7.0) cannot read Go 1.27 export data and fails with "export data
      # version 4 is greater than maximum supported version 2" on every stdlib
      # import. 2026.2rc1 is the first build that understands the 1.27
      # toolchain. Move back to @latest once 2026.2 ships as stable.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.0-rc.1

      - name: Run staticcheck
        run: staticcheck ./...

      # Reports known vulnerabilities in the Go toolchain and stdlib that this
      # binary actually reaches. This proxy's whole job is outbound TLS, so a
      # crypto/tls advisory matters here more than in most projects.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run tests
        run: go test -race -v ./...

  build:
    name: Cross-compile localproxy
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: macos-intel
          - goos: darwin
            goarch: arm64
            suffix: macos-apple-silicon
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe
          - goos: freebsd
            goarch: amd64
            suffix: freebsd-amd64
          - goos: freebsd
            goarch: arm64
            suffix: freebsd-arm64
          - goos: openbsd
            goarch: amd64
            suffix: openbsd-amd64
          - goos: netbsd
            goarch: amd64
            suffix: netbsd-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags="-s -w -X main.Version=${{ github.ref_name }}" \
            -trimpath \
            -o localproxy-${{ matrix.suffix }}${{ matrix.ext }} \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: localproxy-${{ matrix.suffix }}
          path: localproxy-${{ matrix.suffix }}${{ matrix.ext }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
